[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  framework = "#static"
  port = 8888

[[redirects]]
  from = "/i/*"
  to = "/invitation.html?slug=:splat"
  status = 200

[[redirects]]
  from = "/api/invitation/*"
  to = "/.netlify/functions/get-invitation?slug=:splat"
  status = 200
